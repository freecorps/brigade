# The gate for every push to main and every pull request. `babysit-pr` watches the
# "Check, test and build" job by name; rename both together.
name: CI

# Prose-only pushes to main start no runner.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".agents/**/*.md"
      - ".claude/**/*.md"
  # No paths-ignore here: this job is a required check, and a check that never starts blocks the merge.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
      # Fails if a build changed a committed file (package.json exports, compiled messages) or left a new one.
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }
