# Publishes @freecorps/brigade-sdk to npm from main, once CI passed, when packages/sdk/package.json names a version
# that is not on npm yet and CHANGELOG.md has its heading without "(unreleased)". Releasing is that pull request:
# bump the version and date the heading (`## 0.3.0 (2026-11-02)`). Then this tags `sdk-v<version>` and makes a GitHub
# release with that changelog section.
#
# Bun packs it, resolving `workspace:` and `catalog:` (RFC 0002); npm publishes the tarball with provenance. npm
# trusted publishing (this repository and workflow file, set on npmjs.com) needs no token; until then, or for the
# first publish, an NPM_TOKEN secret is used.
name: Release SDK
run-name: Release SDK ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Is this version released?
        id: version
        run: |
          version=$(jq -r .version package.json)
          name=$(jq -r .name package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          heading=$(grep -m1 -E "^## ${version//./\\.}( |$)" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no heading for $version"; exit 1
          elif [[ "$heading" == *"(unreleased)"* ]]; then
            echo "$version is unreleased in CHANGELOG.md: nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is on npm already" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      # `build` also checks dist (scripts/check-dist.mjs): one file, no imports, the README's example verifies.
      - if: steps.version.outputs.publish == 'true'
        run: |
          vp run --filter @freecorps/brigade-sdk build
          vp run --filter @freecorps/brigade-sdk test
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        id: pack
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          echo "tarball=$(ls "$RUNNER_TEMP"/*.tgz)" >> "$GITHUB_OUTPUT"
      # npm 11.5 or later for trusted publishing; Node 24's npm may be older.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          npm install --global npm@11
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # Single quotes on purpose: npm reads the variable itself, so the token never lands in .npmrc.
            # shellcheck disable=SC2016
            npm config set //registry.npmjs.org/:_authToken '${NODE_AUTH_TOKEN}'
          fi
          npm publish "$TARBALL" --provenance --access public
      - name: Tag and GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The changelog section: from this version's heading to the next one.
          awk -v v="$VERSION" '/^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v; next } on' CHANGELOG.md \
            > "$RUNNER_TEMP/notes.md"
          gh release create "sdk-v$VERSION" --target "$SHA" --title "SDK $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
